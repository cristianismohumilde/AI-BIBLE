<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scriptura AI — O Portal dos Manuscritos Antigos</title>
    <meta name="description" content="A principal e maior fonte de traduções interlineares de manuscritos antigos da Bíblia e textos rabínicos (Hebraico, Grego, Aramaico) totalmente geradas pela mais avançada Inteligência Artificial diretamente para o Português.">
    <meta name="keywords" content="manuscritos antigos gerados por ia, tradução bíblica ia, manuscritos hebraicos inteligência artificial, textos originais bíblia ia, scriptura ai, códice de aleppo, septuaginta ia">
    <meta name="theme-color" content="#0b0f19">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-obsidian: #0b0f19;
            --color-teal: #14b8a6;
            --color-emerald: #10b981;
            --color-gold: #fbbf24;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-ancient: 'Cardo', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-obsidian);
            color: #f3f4f6;
            font-family: var(--font-body);
            overflow: hidden; /* Oculta a rolagem para imersão total */
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* O Canvas ocupa toda a tela e fica ao fundo */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto; /* Para detectar o mouse */
        }

        /* Overlay escurecido para garantir legibilidade */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-obsidian) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Wrapper para a animação de flutuação, separando do efeito 3D do mouse */
        .float-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            animation: float-card 6s ease-in-out infinite, fade-in 1.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* O Card Glassmorphism principal (agora com tilt 3D) */
        .hero-card {
            background: rgba(19, 26, 44, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(20, 184, 166, 0.2);
            border-radius: 24px;
            padding: 4rem 3rem;
            text-align: center;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        @keyframes float-card {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fade-in {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Ícone */
        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--color-teal), var(--color-emerald));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 2.5rem;
            color: #fff;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 0 30px rgba(20, 184, 166, 0.4);
            transform: rotate(-5deg);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-card:hover .logo-icon {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 0 0 40px rgba(20, 184, 166, 0.6);
        }

        /* Títulos */
        .hero-card h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #f3f4f6, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .hero-card p {
            color: #9ca3af;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Destaques dourados no texto */
        .hero-card p span {
            color: var(--color-gold);
            font-family: var(--font-ancient);
            font-style: italic;
            font-size: 1.25rem;
        }

        /* Botão Interativo Premium */
        .enter-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--color-teal), var(--color-emerald));
            color: #fff;
            text-decoration: none;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.1rem;
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(20, 184, 166, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* Efeito de brilho passando no botão */
        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-25deg);
            transition: left 0.5s;
        }

        .enter-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(20, 184, 166, 0.4);
        }

        .enter-btn:hover::before {
            left: 200%;
            transition: left 0.7s ease-in-out;
        }

        .enter-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .enter-btn:hover svg {
            transform: translateX(4px);
        }

        /* Estilos adicionais responsivos */
        @media (max-width: 600px) {
            .hero-card {
                padding: 3rem 1.5rem;
            }
            .hero-card h1 {
                font-size: 2.25rem;
            }
            .logo-icon {
                width: 64px;
                height: 64px;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="overlay"></div>

    <div class="float-wrapper">
        <main class="hero-card">
            <div class="logo-icon">S</div>
            <h1>Scriptura AI</h1>
            <p>A mais avançada rede de inteligência artificial traduzindo <span>מגילות</span> (Rolos Antigos) e <span>Χειρόγραφα</span> (Manuscritos) originais diretamente para o seu idioma.</p>
            
            <a href="leitor.html" class="enter-btn">
                Explorar Manuscritos
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </main>
    </div>

    <script>
        /**
         * ============================================================================
         * HTML-IN-CANVAS API: O MISTO PERFEITO
         * Efeito: Poeira de Estrelas + Conexões Neurais + Letras Antigas Caindo
         * ============================================================================
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        
        // Caracteres Hebraicos (Alef-bet) e Gregos (Alfa-omega)
        const ancientChars = [
            'א','ב','ג','ד','ה','ו','ז','ח','ט','י','כ','ל','מ','נ','ס','ע','פ','צ','ק','ר','ש','ת',
            'Α','Β','Γ','Δ','Ε','Ζ','Η','Θ','Ι','Κ','Λ','Μ','Ν','Ξ','Ο','Π','Ρ','Σ','Τ','Υ','Φ','Χ','Ψ','Ω',
            'α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','π','ρ','σ','τ','υ','φ','χ','ψ','ω'
        ];

        // Rastreamento do mouse e Efeito 3D
        const mouse = {
            x: null,
            y: null,
            radius: 150 // Raio de atração/interação das linhas
        };

        const heroCard = document.querySelector('.hero-card');

        window.addEventListener('mousemove', (event) => {
            // Atualiza para o Canvas
            mouse.x = event.x;
            mouse.y = event.y;

            // Efeito 3D Tilt no Card
            if (heroCard) {
                // Suaviza a transição durante o movimento constante
                heroCard.style.transition = 'transform 0.1s ease-out';
                const xAxis = (window.innerWidth / 2 - event.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - event.pageY) / 25;
                heroCard.style.transform = `perspective(1000px) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });

        // Quando o mouse sai da tela
        window.addEventListener('mouseout', () => {
            mouse.x = undefined;
            mouse.y = undefined;

            if (heroCard) {
                // Retorna ao centro de forma suave
                heroCard.style.transition = 'transform 0.5s ease-out';
                heroCard.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
            }
        });

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            init();
        }

        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5; // Tamanho do ponto neural
                // Velocidade de movimento lento e fluido
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                
                // 40% de chance de ser uma letra antiga (efeito Matrix) em vez de ponto
                this.isLetter = Math.random() < 0.40;
                this.char = this.isLetter ? ancientChars[Math.floor(Math.random() * ancientChars.length)] : '';
                this.fontSize = Math.random() * 12 + 10; // 10 a 22px
                
                // Se for letra, cai suavemente para baixo (gravidade fraca)
                if (this.isLetter) {
                    this.vy = Math.random() * 0.6 + 0.2;
                    this.vx = (Math.random() - 0.5) * 0.2;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Reaparecer do outro lado da tela para criar um loop infinito
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                if (this.isLetter) {
                    ctx.font = `${this.fontSize}px 'Cardo', serif`;
                    // Dourado para as letras com um pouco de transparência
                    ctx.fillStyle = `rgba(251, 191, 36, ${this.size / 5 + 0.1})`;
                    ctx.textAlign = 'center';
                    ctx.fillText(this.char, this.x, this.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    // Teal/Esmeralda para as partículas neurais
                    ctx.fillStyle = `rgba(20, 184, 166, ${this.size / 3})`;
                    ctx.fill();
                }
            }
        }

        function init() {
            particles = [];
            // Aumentando ligeiramente a densidade de partículas para mais letras visíveis
            const numParticles = Math.floor((width * height) / 9000);
            
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function connect() {
            let opacityValue = 1;
            // Verifica a distância entre cada partícula
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    const dx = particles[a].x - particles[b].x;
                    const dy = particles[a].y - particles[b].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    // Conexão apenas entre as mais próximas (formando constelações/redes)
                    if (distance < 100) {
                        // Linha mais visível se a distância for menor
                        opacityValue = 1 - (distance / 100);
                        ctx.strokeStyle = `rgba(20, 184, 166, ${opacityValue * 0.25})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }

                // Efeito do Mouse: Conecta as partículas ao mouse se estiverem próximas
                if (mouse.x && mouse.y) {
                    const dx = particles[a].x - mouse.x;
                    const dy = particles[a].y - mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        opacityValue = 1 - (distance / mouse.radius);
                        // Conexão dourada com o mouse (simbolizando o usuário interagindo com o sagrado)
                        ctx.strokeStyle = `rgba(251, 191, 36, ${opacityValue * 0.3})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                        
                        // Leve atração das partículas em direção ao mouse
                        // Apenas para as que não são letras (as letras só caem)
                        if (!particles[a].isLetter) {
                            particles[a].x -= dx * 0.005;
                            particles[a].y -= dy * 0.005;
                        }
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            // Limpa a tela frame a frame
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            
            // Desenha as teias de rede neural / constelações
            connect();
        }

        // Boot da Animação
        resize();
        animate();
    </script>
</body>
</html>
